<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c0d0ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#5578f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080820" stop-opacity="0.99"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#6a8fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#90b0ff" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="60" fill="url(#rim)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#7fa0ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="60" fill="url(#shine)"/>
</svg>
