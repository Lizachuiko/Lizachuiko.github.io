<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pearl settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background:
        linear-gradient(155deg, #fff5fa 0%, #f5f7ff 45%, #f4fff9 100%);
      color: #4a4258;
      font-family: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.005em;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      padding: 18px 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(200,190,230,0.35);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; left: -40px;
      width: 130px; height: 130px;
      background: radial-gradient(circle, rgba(255,210,240,0.5), transparent 70%);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 110px; height: 110px;
      background: radial-gradient(circle, rgba(200,220,255,0.45), transparent 70%);
      pointer-events: none;
    }

    .logo-row { display: flex; align-items: center; gap: 10px; }

    /* pearl lens in header */
    .logo-lens {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.95) 0%, rgba(255,225,242,0.7) 35%, rgba(210,225,255,0.6) 70%, rgba(225,255,242,0.7) 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.8),
        0 2px 10px rgba(255,200,235,0.45),
        0 2px 12px rgba(200,220,255,0.4),
        inset 0 1px 0 rgba(255,255,255,0.95);
      position: relative;
      flex-shrink: 0;
    }
    .logo-lens::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.15) 45%, transparent 70%);
    }

    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(120deg, #5f7f68, #8fa890);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .version {
      font-size: 9px;
      font-family: inherit;
      color: rgba(130,115,160,0.5);
      letter-spacing: 0.1em;
    }

    /* Body */
    .body { padding: 16px 18px; }
    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(120,105,150,0.6);
      font-family: inherit;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid rgba(200,190,230,0.5);
      background: rgba(255,255,255,0.65);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      color: #3a3550;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus, textarea:focus {
      border-color: rgba(190,160,230,0.7);
      background: rgba(255,255,255,0.85);
    }
    input[type="password"] { letter-spacing: 0.1em; }
    textarea { resize: none; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: rgba(120,108,145,0.45); }

    .hint {
      font-size: 10px;
      color: rgba(120,105,150,0.55);
      font-family: inherit;
      margin-top: 5px;
      line-height: 1.4;
    }
    .hint a { color: #a06ad0; }

    /* Key status */
    .key-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-family: inherit;
      letter-spacing: 0.08em;
      color: rgba(120,105,150,0.55);
      margin-top: 6px;
    }
    .key-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(160,150,185,0.4);
      flex-shrink: 0;
    }
    .key-dot.active {
      background: #5fc99a;
      box-shadow: 0 0 6px rgba(95,201,154,0.6);
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(200,190,230,0.35);
      margin: 14px 0;
    }

    /* Save button — pearl gradient */
    .save-btn {
      width: 100%;
      background: linear-gradient(135deg, #f0eaee, #e8dee1);
      color: #4a4350;
      border: 1px solid rgba(220,208,214,0.7);
      border-radius: 9px;
      padding: 11px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.15s, box-shadow 0.15s, transform 0.1s;
      box-shadow: 0 2px 14px rgba(220,190,240,0.55), inset 0 1px 0 rgba(255,255,255,0.85);
      margin-top: 4px;
    }
    .save-btn:hover  { filter: saturate(1.25) brightness(1.03); box-shadow: 0 3px 20px rgba(220,190,240,0.75); }
    .save-btn:active { transform: translateY(1px); }

    .status {
      font-size: 11px;
      font-family: inherit;
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
      letter-spacing: 0.06em;
      color: #6a8a6a;
    }

    .footer {
      padding: 10px 18px 14px;
      font-size: 9px;
      font-family: inherit;
      letter-spacing: 0.12em;
      color: rgba(140,125,170,0.45);
      border-top: 1px solid rgba(200,190,230,0.3);
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-row">
      <div class="logo-lens"></div>
      <span class="logo">Pearl</span>
    </div>
    <span class="version">v0.1</span>
  </div>

  <div class="body">

    <div class="field">
      <label>Your Writing Style</label>
      <textarea id="user-style" rows="3" placeholder="Concise, direct, no fluff. I write in English but sometimes mix in Russian…"></textarea>
      <p class="hint">Pearl uses this when editing and generating.</p>
    </div>

    <button class="save-btn" id="save">Save settings</button>
    <div class="status" id="status"></div>

  </div>

  <div class="footer">Pearl — AI in every input</div>

  <script src="popup.js"></script>
</body>
</html>
